version: '3.8'

services:
  aapla-kayda-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: aapla-kayda-platform:latest
    container_name: aapla_kayda_cloud_app
    restart: always
    ports:
      - "5050:5050"
      - "5055:5055"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - VIDEO_STUDIO_PORT=5055
      - DASHBOARD_ACCESS_PIN=2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN:-}
    volumes:
      - aapla_kayda_data:/app/data
      - aapla_kayda_uploads:/app/backend/data/uploads
      - aapla_kayda_reels:/app/instagram_video_generator/output_reels

volumes:
  aapla_kayda_data:
  aapla_kayda_uploads:
  aapla_kayda_reels:
