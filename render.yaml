services:
  - type: web
    name: aapla-kayda-advocate-pratiksha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: VIDEO_STUDIO_PORT
        value: 5055
      - key: DASHBOARD_ACCESS_PIN
        value: 2026
      - key: GEMINI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
