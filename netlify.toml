[build]
  publish = "docs"
  command = "npm --prefix frontend run build && cp -r frontend/dist/* docs/"

[[redirects]]
  from = "/api/*"
  to = "https://geography-cartoons-soon-incentives.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
